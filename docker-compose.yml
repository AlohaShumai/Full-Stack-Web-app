# AppProj/docker-compose.yml
version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: portfolio-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: portfolio-backend
    depends_on:
      - db
    environment:
      # IMPORTANT: match your Prisma schema and DB settings
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/appdb?schema=public"
      NODE_ENV: "production"
      PORT: "3000"
      # Add any JWT/other secrets here as needed
      # JWT_SECRET: "super-secret"
    ports:
      - "3000:3000"

  frontend:
    build: ./frontend
    container_name: portfolio-frontend
    depends_on:
      - backend
    ports:
      - "5173:80" # host:container (nginx serves on 80)

volumes:
  db-data:
